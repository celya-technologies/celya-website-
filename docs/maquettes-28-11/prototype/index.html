<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celya, accueil retouché (aperçu ordinateur et téléphone)</title>
<style>
html,body{margin:0;height:100%;background:#EDE3D4;font:600 14px/1.2 Figtree,system-ui,sans-serif;color:#151515}
.bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px;background:#151515;border-radius:999px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.bar button{font:inherit;border:0;border-radius:999px;padding:9px 18px;background:transparent;color:#FFF7F0;cursor:pointer}
.bar button[aria-pressed=true]{background:#FFF7F0;color:#151515}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.desk iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#FAF1E4}
.tel{width:390px;height:min(844px,calc(100vh - 90px));margin-top:40px;border-radius:52px;padding:12px;background:#151515;box-shadow:0 40px 80px -30px rgba(40,20,10,.5)}
.tel iframe{width:100%;height:100%;border:0;border-radius:40px;background:#FAF1E4}
</style></head><body>
<div class="bar" role="group" aria-label="Aperçu"><button id="bd" aria-pressed="true">Ordinateur</button><button id="bm" aria-pressed="false">Téléphone</button></div>
<div class="stage desk" id="st"><iframe src="page.html" title="Page d'accueil, vue ordinateur"></iframe></div>
<script>
if(innerWidth<720){location.replace('page.html');}
var st=document.getElementById('st'),bd=document.getElementById('bd'),bm=document.getElementById('bm');
function vue(m){bd.setAttribute('aria-pressed',m?'false':'true');bm.setAttribute('aria-pressed',m?'true':'false');
st.className='stage '+(m?'mob':'desk');
st.innerHTML=m?'<div class="tel"><iframe src="page.html" title="Page d’accueil, vue téléphone"></iframe></div>':'<iframe src="page.html" title="Page d’accueil, vue ordinateur"></iframe>';}
bd.onclick=function(){vue(false)};bm.onclick=function(){vue(true)};
</script></body></html>
